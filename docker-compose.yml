services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: livin-matrix-postgres
    environment:
      POSTGRES_DB: livin_matrix_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/scripts:/docker-entrypoint-initdb.d
    networks:
      - livin-matrix-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d livin_matrix_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端 FastAPI 服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: livin-matrix-backend
    environment:
      # 数据库配置
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/livin_matrix_dev
      # Redis配置
      - REDIS_URL=redis://redis:6379/0
      # JWT配置
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=1440
      # GitHub OAuth配置
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_REDIRECT_URI=${GITHUB_REDIRECT_URI}
      # 邮件服务配置
      - RESEND_API_KEY=${RESEND_API_KEY}
      # 会话配置
      - SESSION_SECRET_KEY=${SESSION_SECRET_KEY}
      # 应用配置
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-true}
      - BACKEND_CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    depends_on:
      - postgres
      - redis
    networks:
      - livin-matrix-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # 前端 React 应用
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: livin-matrix-frontend
    environment:
      # 基础配置
      - VITE_API_BASE_URL=http://localhost:8000
      - VITE_APP_ENVIRONMENT=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      # GitHub OAuth配置
      - VITE_GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
    ports:
      - "3000:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - livin-matrix-network
    stdin_open: true
    tty: true
    restart: unless-stopped

  # Redis (用于缓存和会话存储)
  redis:
    image: redis:7-alpine
    container_name: livin-matrix-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - livin-matrix-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Nginx 反向代理 (生产环境使用)
  nginx:
    image: nginx:alpine
    container_name: livin-matrix-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - livin-matrix-network
    restart: unless-stopped
    deploy:
      replicas: 0  # 默认不启动nginx，仅在生产环境需要时启动

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_venv:
    driver: local
  frontend_node_modules:
    driver: local

networks:
  livin-matrix-network:
    driver: bridge

