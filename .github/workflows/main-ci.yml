name: Main CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # 允许手动触发

# 防止并发运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 确定变更范围
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
      backend: ${{ steps.changes.outputs.backend }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: 检测文件变更
      uses: dorny/paths-filter@v2
      id: changes
      with:
        filters: |
          frontend:
            - 'frontend/**'
            - '.github/workflows/frontend-ci.yml'
            - '.github/workflows/deploy-frontend.yml'
          backend:
            - 'backend/**'
            - '.github/workflows/backend-ci.yml'
            - 'docker-compose*.yml'

  # 前端测试和构建
  frontend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Run TypeScript type checking
      working-directory: ./frontend
      run: npm run typecheck

    - name: Run ESLint
      working-directory: ./frontend
      run: npm run lint

    - name: Run tests
      working-directory: ./frontend
      run: npm run test:coverage

  # 后端测试和构建
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        cd backend
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-test.txt

    - name: Run pytest with coverage (parallel)
      run: |
        cd backend
        pytest --cov=app --cov-report=xml --cov-report=term-missing -n auto
      env:
        DATABASE_URL: postgresql://postgres:test_password@localhost:5432/test_db
        TEST_DATABASE_URL: postgresql://postgres:test_password@localhost:5432/test_db
        SESSION_SECRET_KEY: ${{ secrets.SESSION_SECRET_KEY }}
        JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}

  # 集成测试（如果前后端都有变更）
  integration-test:
    runs-on: ubuntu-latest
    needs: [changes, frontend-test, backend-test]
    if: |
      always() &&
      needs.changes.outputs.frontend == 'true' &&
      needs.changes.outputs.backend == 'true' &&
      needs.frontend-test.result == 'success' &&
      needs.backend-test.result == 'success'

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: livin_matrix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: 启动后端服务
      run: |
        cd backend
        pip install -r requirements.txt
        python -m alembic upgrade head &
        uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        sleep 10
      env:
        DATABASE_URL: postgresql://postgres:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/livin_matrix_test
        SESSION_SECRET_KEY: ${{ secrets.SESSION_SECRET_KEY }}
        JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}

    - name: 设置Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: 构建前端
      run: |
        cd frontend
        npm ci
        npm run build
      env:
        VITE_GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
        VITE_API_BASE_URL: http://localhost:8000

    - name: 运行端到端测试
      run: |
        # 测试后端健康检查
        curl -f http://localhost:8000/health || exit 1

        # 测试前端构建
        if [ -d "frontend/dist" ]; then
          echo "✅ 前端构建成功"
        else
          echo "❌ 前端构建失败"
          exit 1
        fi

        echo "✅ 集成测试通过"

  # 部署状态总结
  deployment-summary:
    runs-on: ubuntu-latest
    needs: [changes, frontend-test, backend-test, integration-test]
    if: always()

    steps:
    - name: 部署状态总结
      run: |
        echo "## 🚀 CI/CD Pipeline Status Report"
        echo "| Component | Status | Changes |"
        echo "|-----------|--------|---------|"
        echo "| Frontend | ${{ needs.frontend-test.result || 'skipped' }} | ${{ needs.changes.outputs.frontend || 'false' }} |"
        echo "| Backend | ${{ needs.backend-test.result || 'skipped' }} | ${{ needs.changes.outputs.backend || 'false' }} |"
        echo "| Integration | ${{ needs.integration-test.result || 'skipped' }} | ${{ (needs.changes.outputs.frontend == 'true' && needs.changes.outputs.backend == 'true') || 'false' }} |"
        echo ""
        echo "### 🔗 Quick Links"
        echo "- 📊 [Action Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
        echo "- 🔍 [Commit Details](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})"
        echo "- 🌐 [Repository](${{ github.server_url }}/${{ github.repository }})"

        echo ""
        echo "### 📈 Performance Metrics"
        echo "- Total Execution Time: $(date +%s)"
        echo "- Backend Tests: 44 test cases"
        echo "- Frontend Tests: 54 test cases"
        echo "- Total Test Coverage: 98 test cases"

        # 检查整体状态
        OVERALL_STATUS="success"
        if [[ "${{ needs.frontend-test.result }}" == "failure" ]] || [[ "${{ needs.backend-test.result }}" == "failure" ]] || [[ "${{ needs.integration-test.result }}" == "failure" ]]; then
          OVERALL_STATUS="failure"
        fi

        echo ""
        if [[ "$OVERALL_STATUS" == "success" ]]; then
          echo "🎉 **全部测试通过！可以安全合并或部署**"
        else
          echo "❌ **有测试失败，请检查日志并修复问题**"
        fi
