# 安全组配置
# 基于最小权限原则的网络安全配置

apiVersion: ec2.aws.amazon.com/v1beta1
kind: SecurityGroup
metadata:
  name: livin-matrix-alb-sg
spec:
  groupName: "livin-matrix-alb-sg"
  groupDescription: "Security group for Application Load Balancer"
  vpcId: !Ref LivinMatrixVPC
  securityGroupIngress:
    - ipProtocol: "tcp"
      fromPort: 80
      toPort: 80
      cidrIp: "0.0.0.0/0"
      description: "HTTP access from internet"
    - ipProtocol: "tcp"
      fromPort: 443
      toPort: 443
      cidrIp: "0.0.0.0/0"
      description: "HTTPS access from internet"
  securityGroupEgress:
    - ipProtocol: "tcp"
      fromPort: 80
      toPort: 80
      destinationSecurityGroupId: !Ref LivinMatrixEKSSG
      description: "HTTP to EKS nodes"
    - ipProtocol: "tcp"
      fromPort: 8000
      toPort: 8000
      destinationSecurityGroupId: !Ref LivinMatrixEKSSG
      description: "Backend API to EKS nodes"
  tags:
    Name: "livin-matrix-alb-sg"
    Project: "LiVin-Matrix"
    Type: "load-balancer"

---
# EKS集群安全组
apiVersion: ec2.aws.amazon.com/v1beta1
kind: SecurityGroup
metadata:
  name: livin-matrix-eks-sg
spec:
  groupName: "livin-matrix-eks-sg"
  groupDescription: "Security group for EKS cluster nodes"
  vpcId: !Ref LivinMatrixVPC
  securityGroupIngress:
    # 来自ALB的HTTP流量
    - ipProtocol: "tcp"
      fromPort: 80
      toPort: 80
      sourceSecurityGroupId: !Ref LivinMatrixALBSG
      description: "HTTP from ALB"
    # 来自ALB的后端API流量
    - ipProtocol: "tcp"
      fromPort: 8000
      toPort: 8000
      sourceSecurityGroupId: !Ref LivinMatrixALBSG
      description: "Backend API from ALB"
    # 节点间通信
    - ipProtocol: "tcp"
      fromPort: 0
      toPort: 65535
      sourceSecurityGroupId: !Ref LivinMatrixEKSSG
      description: "Node to node communication"
    # Kubernetes API服务器通信
    - ipProtocol: "tcp"
      fromPort: 443
      toPort: 443
      sourceSecurityGroupId: !Ref LivinMatrixEKSControlPlaneSG
      description: "HTTPS from EKS control plane"
  securityGroupEgress:
    # 访问RDS数据库
    - ipProtocol: "tcp"
      fromPort: 5432
      toPort: 5432
      destinationSecurityGroupId: !Ref LivinMatrixRDSSG
      description: "PostgreSQL to RDS"
    # 访问互联网（用于拉取容器镜像）
    - ipProtocol: "tcp"
      fromPort: 443
      toPort: 443
      cidrIp: "0.0.0.0/0"
      description: "HTTPS to internet"
    - ipProtocol: "tcp"
      fromPort: 80
      toPort: 80
      cidrIp: "0.0.0.0/0"
      description: "HTTP to internet"
  tags:
    Name: "livin-matrix-eks-sg"
    Project: "LiVin-Matrix"
    Type: "compute"

---
# EKS控制平面安全组
apiVersion: ec2.aws.amazon.com/v1beta1
kind: SecurityGroup
metadata:
  name: livin-matrix-eks-control-plane-sg
spec:
  groupName: "livin-matrix-eks-control-plane-sg"
  groupDescription: "Security group for EKS control plane"
  vpcId: !Ref LivinMatrixVPC
  securityGroupIngress:
    # kubectl访问
    - ipProtocol: "tcp"
      fromPort: 443
      toPort: 443
      cidrIp: "10.0.0.0/16"
      description: "kubectl access from VPC"
  securityGroupEgress:
    # 与工作节点通信
    - ipProtocol: "tcp"
      fromPort: 443
      toPort: 443
      destinationSecurityGroupId: !Ref LivinMatrixEKSSG
      description: "HTTPS to worker nodes"
    - ipProtocol: "tcp"
      fromPort: 1025
      toPort: 65535
      destinationSecurityGroupId: !Ref LivinMatrixEKSSG
      description: "Kubelet communication"
  tags:
    Name: "livin-matrix-eks-control-plane-sg"
    Project: "LiVin-Matrix"
    Type: "control-plane"

---
# RDS数据库安全组
apiVersion: ec2.aws.amazon.com/v1beta1
kind: SecurityGroup
metadata:
  name: livin-matrix-rds-sg
spec:
  groupName: "livin-matrix-rds-sg"
  groupDescription: "Security group for RDS PostgreSQL database"
  vpcId: !Ref LivinMatrixVPC
  securityGroupIngress:
    # 仅允许EKS节点访问数据库
    - ipProtocol: "tcp"
      fromPort: 5432
      toPort: 5432
      sourceSecurityGroupId: !Ref LivinMatrixEKSSG
      description: "PostgreSQL access from EKS nodes"
  # 无出站规则 - RDS不需要主动访问外部
  tags:
    Name: "livin-matrix-rds-sg"
    Project: "LiVin-Matrix"
    Type: "database"

---
# 备用管理访问安全组（紧急情况使用）
apiVersion: ec2.aws.amazon.com/v1beta1
kind: SecurityGroup
metadata:
  name: livin-matrix-admin-sg
spec:
  groupName: "livin-matrix-admin-sg"
  groupDescription: "Emergency admin access security group"
  vpcId: !Ref LivinMatrixVPC
  securityGroupIngress:
    # SSH访问（仅限紧急情况）
    - ipProtocol: "tcp"
      fromPort: 22
      toPort: 22
      cidrIp: "0.0.0.0/0"  # 生产环境应限制为特定IP
      description: "SSH access for emergency admin"
  securityGroupEgress:
    - ipProtocol: "tcp"
      fromPort: 443
      toPort: 443
      cidrIp: "0.0.0.0/0"
      description: "HTTPS to internet"
  tags:
    Name: "livin-matrix-admin-sg"
    Project: "LiVin-Matrix"
    Type: "admin"
    Usage: "emergency-only"