# Application Load Balancer配置
# 用于处理HTTPS流量并转发到EKS服务

apiVersion: elbv2.aws.amazon.com/v1beta1
kind: LoadBalancer
metadata:
  name: livin-matrix-alb
spec:
  name: "livin-matrix-alb"
  type: "application"
  scheme: "internet-facing"
  
  # 安全组配置
  securityGroups:
    - !Ref LivinMatrixALBSG
  
  # 子网配置 - 使用公有子网
  subnets:
    - !Ref LivinMatrixPublicSubnet1a
    - !Ref LivinMatrixPublicSubnet1b
  
  # IP地址类型
  ipAddressType: "ipv4"
  
  # 负载均衡器属性
  loadBalancerAttributes:
    - key: "access_logs.s3.enabled"
      value: "true"
    - key: "access_logs.s3.bucket"
      value: !Ref LivinMatrixLogsBucket
    - key: "access_logs.s3.prefix"
      value: "alb-logs"
    - key: "idle_timeout.timeout_seconds"
      value: "60"
    - key: "routing.http2.enabled"
      value: "true"
    - key: "routing.http.drop_invalid_header_fields.enabled"
      value: "true"
  
  # 标签
  tags:
    - key: "Name"
      value: "livin-matrix-alb"
    - key: "Project"
      value: "LiVin-Matrix"
    - key: "Environment"
      value: "production"

---
# HTTPS监听器
apiVersion: elbv2.aws.amazon.com/v1beta1
kind: Listener
metadata:
  name: livin-matrix-https-listener
spec:
  loadBalancerArn: !Ref LivinMatrixALB
  port: 443
  protocol: "HTTPS"
  
  # SSL配置
  sslPolicy: "ELBSecurityPolicy-TLS-1-2-2017-01"
  certificates:
    - certificateArn: !Ref LivinMatrixSSLCertificate
  
  # 默认操作 - 转发到后端服务
  defaultActions:
    - type: "forward"
      targetGroupArn: !Ref LivinMatrixBackendTG
  
  # 路由规则
  rules:
    # API路由
    - priority: 100
      conditions:
        - field: "path-pattern"
          values: ["/api/*"]
      actions:
        - type: "forward"
          targetGroupArn: !Ref LivinMatrixBackendTG
    
    # 健康检查路由
    - priority: 200
      conditions:
        - field: "path-pattern"
          values: ["/health", "/healthz"]
      actions:
        - type: "forward"
          targetGroupArn: !Ref LivinMatrixBackendTG
    
    # 静态资源重定向到GitHub Pages
    - priority: 300
      conditions:
        - field: "path-pattern"
          values: ["/*"]
      actions:
        - type: "redirect"
          redirectConfig:
            protocol: "HTTPS"
            port: "443"
            host: "#{host}"
            path: "/#{path}"
            query: "#{query}"
            statusCode: "HTTP_301"

---
# HTTP监听器 - 重定向到HTTPS
apiVersion: elbv2.aws.amazon.com/v1beta1
kind: Listener
metadata:
  name: livin-matrix-http-listener
spec:
  loadBalancerArn: !Ref LivinMatrixALB
  port: 80
  protocol: "HTTP"
  
  defaultActions:
    - type: "redirect"
      redirectConfig:
        protocol: "HTTPS"
        port: "443"
        host: "#{host}"
        path: "/#{path}"
        query: "#{query}"
        statusCode: "HTTP_301"

---
# 后端服务目标组
apiVersion: elbv2.aws.amazon.com/v1beta1
kind: TargetGroup
metadata:
  name: livin-matrix-backend-tg
spec:
  name: "livin-matrix-backend-tg"
  port: 8000
  protocol: "HTTP"
  vpcId: !Ref LivinMatrixVPC
  targetType: "ip"  # 用于EKS Pod IP
  
  # 健康检查配置
  healthCheckEnabled: true
  healthCheckIntervalSeconds: 30
  healthCheckPath: "/health"
  healthCheckPort: "traffic-port"
  healthCheckProtocol: "HTTP"
  healthCheckTimeoutSeconds: 5
  healthyThresholdCount: 2
  unhealthyThresholdCount: 3
  matcher:
    httpCode: "200"
  
  # 目标组属性
  targetGroupAttributes:
    - key: "deregistration_delay.timeout_seconds"
      value: "30"
    - key: "stickiness.enabled"
      value: "false"
    - key: "load_balancing.algorithm.type"
      value: "round_robin"
  
  tags:
    - key: "Name"
      value: "livin-matrix-backend-tg"
    - key: "Project"
      value: "LiVin-Matrix"
    - key: "Service"
      value: "backend-api"

---
# SSL证书（AWS Certificate Manager）
apiVersion: certificatemanager.aws.amazon.com/v1beta1
kind: Certificate
metadata:
  name: livin-matrix-ssl-cert
spec:
  domainName: "api.livin-matrix.example.com"  # 替换为实际域名
  subjectAlternativeNames:
    - "*.livin-matrix.example.com"
  validationMethod: "DNS"
  domainValidationOptions:
    - domainName: "api.livin-matrix.example.com"
      validationDomain: "livin-matrix.example.com"
  tags:
    - key: "Name"
      value: "livin-matrix-ssl-cert"
    - key: "Project"
      value: "LiVin-Matrix"

---
# 访问日志S3存储桶
apiVersion: s3.aws.amazon.com/v1beta1
kind: Bucket
metadata:
  name: livin-matrix-logs-bucket
spec:
  bucketName: "livin-matrix-alb-logs-${random_suffix}"
  region: "us-east-1"
  
  # 访问控制
  publicAccessBlockConfiguration:
    blockPublicAcls: true
    blockPublicPolicy: true
    ignorePublicAcls: true
    restrictPublicBuckets: true
  
  # 生命周期配置
  lifecycleConfiguration:
    rules:
      - id: "DeleteOldLogs"
        status: "Enabled"
        expiration:
          days: 30  # 30天后删除日志
        noncurrentVersionExpiration:
          noncurrentDays: 7
  
  # 加密配置
  serverSideEncryptionConfiguration:
    rules:
      - applyServerSideEncryptionByDefault:
          sseAlgorithm: "AES256"
        bucketKeyEnabled: true
  
  tags:
    - key: "Name"
      value: "livin-matrix-logs"
    - key: "Project"
      value: "LiVin-Matrix"
    - key: "Purpose"
      value: "access-logs"

---
# ALB访问日志的存储桶策略
apiVersion: s3.aws.amazon.com/v1beta1
kind: BucketPolicy
metadata:
  name: livin-matrix-logs-bucket-policy
spec:
  bucket: !Ref LivinMatrixLogsBucket
  policyDocument:
    Version: "2012-10-17"
    Statement:
      - Sid: "AWSLogDeliveryWrite"
        Effect: "Allow"
        Principal:
          AWS: "arn:aws:iam::127311923021:root"  # us-east-1 ELB service account
        Action: "s3:PutObject"
        Resource: !Sub "${LivinMatrixLogsBucket}/alb-logs/AWSLogs/${AWS::AccountId}/*"
      - Sid: "AWSLogDeliveryAclCheck"
        Effect: "Allow"
        Principal:
          AWS: "arn:aws:iam::127311923021:root"  # us-east-1 ELB service account
        Action: "s3:GetBucketAcl"
        Resource: !Ref LivinMatrixLogsBucket

---
# Route53 DNS记录（可选）
apiVersion: route53.aws.amazon.com/v1beta1
kind: RecordSet
metadata:
  name: livin-matrix-api-dns
spec:
  hostedZoneId: "Z123456789"  # 替换为实际的Hosted Zone ID
  name: "api.livin-matrix.example.com"
  type: "A"
  aliasTarget:
    dnsName: !GetAtt LivinMatrixALB.DNSName
    hostedZoneId: !GetAtt LivinMatrixALB.CanonicalHostedZoneID
    evaluateTargetHealth: true
  
  comment: "API endpoint for LiVin Matrix application"
  tags:
    - key: "Project"
      value: "LiVin-Matrix"