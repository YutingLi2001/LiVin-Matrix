---
# TLS证书Secret（由cert-manager管理）
apiVersion: v1
kind: Secret
metadata:
  name: livin-matrix-tls-cert
  namespace: livin-matrix-prod
  labels:
    app: livin-matrix
    component: tls
  annotations:
    cert-manager.io/certificate-name: livin-matrix-cert
type: kubernetes.io/tls
data:
  # 将由cert-manager自动填充
  tls.crt: ""
  tls.key: ""

