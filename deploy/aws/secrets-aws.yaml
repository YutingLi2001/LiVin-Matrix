# AWS Secret Manager集成配置
# 使用External Secrets Operator从AWS Secrets Manager获取敏感信息

apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: livin-matrix-aws-secret-store
  namespace: livin-matrix-prod
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        # 使用IRSA (IAM Roles for Service Accounts)
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets-system

---
# 数据库凭据External Secret
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: livin-matrix-db-secret
  namespace: livin-matrix-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: livin-matrix-aws-secret-store
    kind: SecretStore
  target:
    name: livin-matrix-db-secret
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        database-url: "postgresql://{{ .username }}:{{ .password }}@{{ .host }}:5432/livin_matrix?sslmode=require"
        host: "{{ .host }}"
        username: "{{ .username }}"
        password: "{{ .password }}"
        port: "5432"
        dbname: "livin_matrix"
  data:
  - secretKey: username
    remoteRef:
      key: livin-matrix/database/credentials
      property: username
  - secretKey: password
    remoteRef:
      key: livin-matrix/database/credentials
      property: password
  - secretKey: host
    remoteRef:
      key: livin-matrix/database/credentials
      property: host

---
# 应用程序密钥External Secret
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: livin-matrix-app-secrets
  namespace: livin-matrix-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: livin-matrix-aws-secret-store
    kind: SecretStore
  target:
    name: livin-matrix-app-secrets
    creationPolicy: Owner
  data:
  - secretKey: secret-key
    remoteRef:
      key: livin-matrix/app/secrets
      property: secret_key
  - secretKey: jwt-secret
    remoteRef:
      key: livin-matrix/app/secrets
      property: jwt_secret
  - secretKey: api-key
    remoteRef:
      key: livin-matrix/app/secrets
      property: api_key

---
# 第三方服务密钥External Secret（如果需要）
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: livin-matrix-external-secrets
  namespace: livin-matrix-prod
spec:
  refreshInterval: 6h
  secretStoreRef:
    name: livin-matrix-aws-secret-store
    kind: SecretStore
  target:
    name: livin-matrix-external-secrets
    creationPolicy: Owner
  data:
  - secretKey: sentry-dsn
    remoteRef:
      key: livin-matrix/external/services
      property: sentry_dsn
  - secretKey: smtp-password
    remoteRef:
      key: livin-matrix/external/services
      property: smtp_password
  - secretKey: s3-access-key
    remoteRef:
      key: livin-matrix/external/services
      property: s3_access_key
  - secretKey: s3-secret-key
    remoteRef:
      key: livin-matrix/external/services
      property: s3_secret_key

---
