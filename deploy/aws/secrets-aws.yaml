---
# AWS IAM Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: external-secrets-system
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/ExternalSecretsRole
automountServiceAccountToken: true

---
# External Secrets Operator配置
apiVersion: v1
kind: ServiceAccount
metadata:
  name: livin-matrix-backend-sa
  namespace: livin-matrix-prod
  labels:
    app: livin-matrix
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/LiVinMatrixBackendRole
automountServiceAccountToken: true
