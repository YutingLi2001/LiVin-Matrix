# AWS EKS环境配置映射
# 包含应用程序的非敏感配置信息

apiVersion: v1
kind: ConfigMap
metadata:
  name: livin-matrix-config
  namespace: livin-matrix-prod
  labels:
    app: livin-matrix
    component: config
  annotations:
    config.kubernetes.io/origin: "aws-deployment"
data:
  # 应用基础配置
  environment: "production"
  project-name: "LiVin Matrix"
  api-v1-str: "/api/v1"
  debug: "false"
  log-level: "INFO"
  log-format: "json"
  
  # CORS配置
  allowed-origins: "https://livin-matrix.github.io,https://api.livin-matrix.example.com"
  
  # 数据库配置（非敏感信息）
  db-port: "5432"
  db-name: "livin_matrix"
  db-ssl-mode: "require"
  db-pool-size: "10"
  db-max-overflow: "20"
  db-pool-timeout: "30"
  
  # AWS区域配置
  aws-region: "us-east-1"
  aws-default-region: "us-east-1"
  
  # 健康检查配置
  health-check-path: "/health"
  health-check-timeout: "5"
  
  # API配置
  api-docs-url: "/docs"
  api-redoc-url: "/redoc"
  api-title: "LiVin Matrix API"
  api-description: "Life Vitality Interconnection Matrix - 生活活力互联矩阵"
  api-version: "1.0.0"
  
  # 分页配置
  default-page-size: "20"
  max-page-size: "100"
  
  # 缓存配置
  cache-ttl: "3600"
  cache-enabled: "true"
  
  # 监控配置
  metrics-enabled: "true"
  metrics-path: "/metrics"
  metrics-port: "9090"
  
  # 文件上传配置
  max-file-size: "10485760"  # 10MB
  allowed-file-types: "image/jpeg,image/png,image/gif,text/csv"
  
  # 时区配置
  timezone: "UTC"
  date-format: "YYYY-MM-DD"
  datetime-format: "YYYY-MM-DD HH:mm:ss"
  
  # 安全配置
  password-min-length: "8"
  session-timeout: "1800"  # 30分钟
  max-login-attempts: "5"
  
  # 邮件配置（如果需要）
  smtp-port: "587"
  smtp-use-tls: "true"
  
  # 矩阵配置
  matrix-dimensions: "6"
  correlation-threshold: "0.1"
  analysis-window-days: "30"
  
  # 前端配置
  frontend-url: "https://livin-matrix.github.io"
  
  # 第三方服务配置
  sentry-environment: "production"
  
---
# AWS特定配置
apiVersion: v1
kind: ConfigMap
metadata:
  name: livin-matrix-aws-config
  namespace: livin-matrix-prod
  labels:
    app: livin-matrix
    component: aws-config
data:
  # EKS集群信息
  cluster-name: "livin-matrix-cluster"
  cluster-region: "us-east-1"
  
  # RDS配置
  rds-instance-identifier: "livin-matrix-db"
  rds-engine: "postgres"
  rds-engine-version: "15.4"
  
  # S3配置（如果需要文件存储）
  s3-bucket-name: "livin-matrix-files-prod"
  s3-region: "us-east-1"
  
  # CloudWatch配置
  cloudwatch-log-group: "/aws/eks/livin-matrix-cluster/cluster"
  cloudwatch-metrics-namespace: "LiVin-Matrix/Backend"
  
  # ALB配置
  alb-name: "livin-matrix-alb"
  alb-scheme: "internet-facing"
  alb-target-type: "ip"
  
  # VPC配置
  vpc-id: "vpc-12345678"  # 将由部署脚本替换
  subnet-ids: "subnet-12345678,subnet-87654321"  # 将由部署脚本替换
  
  # 安全组配置
  security-group-id: "sg-12345678"  # 将由部署脚本替换
  
  # IAM角色配置
  pod-execution-role: "arn:aws:iam::ACCOUNT_ID:role/LiVinMatrixBackendRole"
  cluster-service-role: "arn:aws:iam::ACCOUNT_ID:role/LiVinMatrixClusterRole"
  node-group-role: "arn:aws:iam::ACCOUNT_ID:role/LiVinMatrixNodeGroupRole"
  
---
# Nginx配置（如果需要作为sidecar）
apiVersion: v1
kind: ConfigMap
metadata:
  name: livin-matrix-nginx-config
  namespace: livin-matrix-prod
  labels:
    app: livin-matrix
    component: nginx
data:
  nginx.conf: |
    upstream backend {
        server 127.0.0.1:8000;
    }
    
    server {
        listen 80;
        server_name _;
        
        # 健康检查
        location /health {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # API代理
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # 超时配置
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # 缓冲配置
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }
        
        # 文档页面
        location /docs {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        location /redoc {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # 静态文件重定向到GitHub Pages
        location / {
            return 301 https://livin-matrix.github.io$request_uri;
        }
        
        # 安全headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
    }
    
    # 全局配置
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /tmp/nginx.pid;
    
    events {
        worker_connections 1024;
        use epoll;
        multi_accept on;
    }
    
    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        
        # 日志格式
        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent" "$http_x_forwarded_for"';
        
        access_log /var/log/nginx/access.log main;
        
        # 性能优化
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;
        
        # Gzip压缩
        gzip on;
        gzip_vary on;
        gzip_min_length 10240;
        gzip_proxied expired no-cache no-store private must-revalidate max-age=0;
        gzip_types
            text/plain
            text/css
            text/xml
            text/javascript
            application/javascript
            application/xml+rss
            application/json;
    }