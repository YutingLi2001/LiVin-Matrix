apiVersion: v1
kind: Secret
metadata:
  name: livin-matrix-secrets
  namespace: livin-matrix-staging
type: Opaque
stringData:
  # 数据库密码
  POSTGRES_PASSWORD: "staging_password_123"
  
  # JWT密钥
  SECRET_KEY: "staging-super-secret-key-change-in-production"
  
  # Auth0配置 (示例值，需要在实际部署时替换)
  AUTH0_DOMAIN: "your-domain.auth0.com"
  AUTH0_CLIENT_ID: "your-client-id"
  AUTH0_CLIENT_SECRET: "your-client-secret"