# Docker Compose 本地开发环境配置
# 使用方式: docker-compose -f docker-compose.yml -f docker-compose.local.yml up -d
# 本地开发也使用Docker Secrets，确保与生产环境一致

services:
  # PostgreSQL 数据库 - 本地开发使用Docker Secrets
  postgres:
    environment:
      POSTGRES_DB: livin_matrix_dev
      POSTGRES_USER: postgres
    volumes:
      - ./database/scripts/postgres-entrypoint.sh:/usr/local/bin/custom-entrypoint.sh:ro
      - ./secrets:/var/secrets:ro
    entrypoint: ["/usr/local/bin/custom-entrypoint.sh"]
    command: ["postgres"]

  # 后端 FastAPI 服务 - 本地开发使用Docker Secrets
  backend:
    environment:
      # 本地开发环境配置
      - DATABASE_URL=postgresql://postgres@postgres:5432/livin_matrix_dev
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
      - DEBUG=true
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - BACKEND_CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000","http://localhost:5173","http://127.0.0.1:5173"]
      # 本地开发也启用Docker Secrets模式
      - USE_DOCKER_SECRETS=true
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
      - ./secrets:/var/secrets:ro

  # 前端 React 应用 - 本地开发
  frontend:
    environment:
      # 本地开发API配置
      - VITE_API_BASE_URL=http://localhost:8000
      - VITE_APP_ENVIRONMENT=development

  # 本地开发不需要Nginx
  nginx:
    deploy:
      replicas: 0  # 本地开发禁用nginx
