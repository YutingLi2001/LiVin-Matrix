# Docker Compose Secrets 配置
# 生产环境专用，与基础 docker-compose.yml 结合使用
# 使用方式: docker-compose -f docker-compose.yml -f docker-compose.secrets.yml up -d

services:
  # PostgreSQL 数据库 - 使用secrets文件夹 + 自定义entrypoint
  postgres:
    environment:
      POSTGRES_DB: livin_matrix_dev
      POSTGRES_USER: postgres
    volumes:
      - ./database/scripts/postgres-entrypoint.sh:/usr/local/bin/custom-entrypoint.sh:ro
      - ./secrets:/var/secrets:ro
    entrypoint: ["/usr/local/bin/custom-entrypoint.sh"]
    command: ["postgres"]

  # 后端 FastAPI 服务 - 使用secrets文件夹
  backend:
    image: livin-matrix-backend:latest
    environment:
      # 使用secrets文件夹模式
      - DATABASE_URL=postgresql://postgres@postgres:5432/livin_matrix_dev
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
      - DEBUG=true
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - BACKEND_CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
      # 启用Docker Secrets模式从/var/secrets读取
      - USE_DOCKER_SECRETS=true
    ports:
      - "8000:8000"
    networks:
      - livin-matrix-network
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
      - ./secrets:/var/secrets:ro

# 测试阶段：使用文件挂载方式，无需external secrets定义
